<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Adarsha | Redesign visual review</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f3ec;color:#2c211d;font:15px/1.6 system-ui,sans-serif}header{position:sticky;top:0;z-index:1;padding:22px 5%;background:#f6f3ecf5;border-bottom:1px solid #d8d0c5;backdrop-filter:blur(15px)}h1{font-size:27px;letter-spacing:-1px;margin:0}p{margin:8px 0}nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:17px}button{border:1px solid #d8d0c5;border-radius:99px;padding:10px 18px;color:#2c211d;background:transparent;cursor:pointer;font:inherit}button[aria-pressed=true]{background:#2c211d;color:#f6f3ec}main{padding:30px 5% 70px}.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}figure{margin:0;min-width:0}figcaption{font-weight:600;font-size:19px;padding:12px 0}a{display:block;color:inherit}img{display:block;width:100%;height:auto;box-shadow:0 10px 30px #2c211d15;border:1px solid #d8d0c5;border-radius:12px}.mobile figure{max-width:390px}.mobile{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}small{color:#70645b}@media(max-width:700px){.gallery{grid-template-columns:1fr}h1{font-size:24px}}
</style></head><body><header><h1>adarsha. / a new perspective</h1><p>Visual review of the implemented pages. Open any image at full resolution.</p><small>Local QA captures. This gallery is outside the production build.</small><nav aria-label="Screenshot view"><button data-width="1440" aria-pressed="true">Desktop</button><button data-width="390" aria-pressed="false">Mobile</button><button data-theme="light" aria-pressed="true">Light</button><button data-theme="dark" aria-pressed="false">Dark</button></nav></header><main><div class="gallery" id="gallery"></div></main><script>
const pages=['Home','About','Work','Skills','Education','Credentials','Articles','Contact'];let width='1440',theme='light';function render(){const gallery=document.getElementById('gallery');gallery.classList.toggle('mobile',width==='390');gallery.innerHTML=pages.map(name=>{const file='../test-results/v4/'+name.toLowerCase()+'-'+width+'-'+theme+'.png';return '<figure><figcaption>'+name+'</figcaption><a href="'+file+'" target="_blank" rel="noopener"><img src="'+file+'" alt="'+name+', '+width+' pixels, '+theme+' theme" loading="lazy"></a></figure>'}).join('');document.querySelectorAll('button').forEach(button=>button.setAttribute('aria-pressed',button.dataset.width?button.dataset.width===width:button.dataset.theme===theme))}document.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>{if(button.dataset.width)width=button.dataset.width;if(button.dataset.theme)theme=button.dataset.theme;render()}));render();
</script></body></html>
